# Declared divergences between the ceph dashboard and ceph-api response
# bodies. Keys are endpoint ids in the form "<METHOD> <PATH-TEMPLATE>"
# (as in api/http.yaml); values are lists of JSONPath ignores with
# mandatory `reason:` strings.
#
# Every entry IS the migration guide for dashboard clients — something
# a client switching from the dashboard to ceph-api would observe.
#
# JSONPath subset: $ root, . descent, * wildcard for "any array index
# or map key" at a single position. See test/parity/diff.go for the
# matcher. A `$` (root) ignore additionally suppresses the body-presence
# and status-class checks — used as a transitional marker for endpoints
# whose response (or request) shape is known divergent. Each one is a
# debt: walk them in the next iteration and either match the dashboard
# or document a hard reason why we can't.

# /api/cluster/user — POST/PUT bodies still diverge: dashboard returns
# a status-string ("Successfully created/edited user '..'"), ceph-api
# returns Empty. Same CUD-returns-resource debt as /api/role and /api/user.
"POST /api/cluster/user":
  - path: $
    reason: dashboard returns a status-string body; ceph-api returns Empty. CUD-returns-resource debt.
"PUT /api/cluster/user":
  - path: $
    reason: dashboard returns a status-string body; ceph-api returns Empty. CUD-returns-resource debt.
"POST /api/cluster/user/export":
  - path: $
    reason: each backend's `POST /api/cluster/user` calls `auth add` independently and ceph generates a fresh random cephx key per create; the exported body differs only in the key value. To close, seed both creates with import_data carrying a fixed key.

# /api/crush_rule — proto Rule serializes int64 fields as strings
# (protojson convention), and models step as `map<string,string> entries`
# while the dashboard returns typed step fields. Fix wants a proto rework.
"GET /api/crush_rule":
  - path: $.*.rule_id
    reason: protojson serializes proto int64 as string; dashboard returns integer.
  - path: $.*.type
    reason: same int64-as-string protojson convention.
  - path: $.*.ruleset
    reason: ceph-api proto Rule emits ruleset 0 as string; dashboard returns the real CRUSH ruleset integer.
  - path: $.*.min_size
    reason: ceph-api proto Rule emits min_size as string; dashboard returns integer.
  - path: $.*.max_size
    reason: ceph-api proto Rule emits max_size as string; dashboard returns integer.
  - path: $.*.steps.*.entries
    reason: ceph-api Step is `map<string,string> entries`; dashboard returns typed step fields (op/item/item_name/num/type).
  - path: $.*.steps.*.op
    reason: typed step field not represented in ceph-api proto. See $.*.steps.*.entries.
  - path: $.*.steps.*.item
    reason: see $.*.steps.*.entries.
  - path: $.*.steps.*.item_name
    reason: see $.*.steps.*.entries.
  - path: $.*.steps.*.num
    reason: see $.*.steps.*.entries.
  - path: $.*.steps.*.type
    reason: see $.*.steps.*.entries.

"GET /api/crush_rule/{name}":
  - path: $.rule_id
    reason: protojson serializes proto int64 as string; dashboard returns integer.
  - path: $.type
    reason: same int64-as-string protojson convention.
  - path: $.ruleset
    reason: ceph-api proto Rule emits 0 as string; dashboard returns the real CRUSH ruleset integer.
  - path: $.min_size
    reason: ceph-api proto Rule emits min_size as string; dashboard returns integer.
  - path: $.max_size
    reason: ceph-api proto Rule emits max_size as string; dashboard returns integer.
  - path: $.steps.*.entries
    reason: ceph-api Step is map<string,string> entries; dashboard returns typed step fields.
  - path: $.steps.*.op
    reason: see $.steps.*.entries.
  - path: $.steps.*.item
    reason: see $.steps.*.entries.
  - path: $.steps.*.item_name
    reason: see $.steps.*.entries.
  - path: $.steps.*.num
    reason: see $.steps.*.entries.
  - path: $.steps.*.type
    reason: see $.steps.*.entries.

"POST /api/crush_rule":
  - path: $
    reason: dashboard returns the created Rule resource; ceph-api returns Empty. Could match if CreateRule returns the rule.

# /api/user — dashboard's User module uses camelCase
# (lastUpdate/pwdUpdateRequired/pwdExpirationDate); ceph-api emits
# snake_case via UseProtoNames. Either side has to break convention to
# converge. The list-length divergence is dashboard caching its user
# table at startup.
"GET /api/user":
  - path: $
    reason: dashboard's User module is the lone camelCase outlier in dashboard's API; ceph-api uses project-wide snake_case (UseProtoNames). List length also differs because the dashboard caches users at startup and doesn't see entries ceph-api added later via mgr config-key set.
"GET /api/user/{username}":
  - path: $.lastUpdate
    reason: dashboard camelCase; ceph-api emits snake_case last_update.
  - path: $.last_update
    reason: see $.lastUpdate (symmetric extra-vs-missing).
  - path: $.pwdUpdateRequired
    reason: dashboard camelCase; ceph-api emits snake_case pwd_update_required.
  - path: $.pwd_update_required
    reason: see $.pwdUpdateRequired.
  - path: $.pwdExpirationDate
    reason: dashboard camelCase; ceph-api emits pwd_expiration_date as google.protobuf.Timestamp (ISO-8601) rather than a unix integer.
  - path: $.pwd_expiration_date
    reason: see $.pwdExpirationDate.
  - path: $.name
    reason: declared field; both sides return null/absent for this fixture, recorded as missing on both.
  - path: $.email
    reason: declared field; both sides return null/absent for this fixture.
"POST /api/user":
  - path: $
    reason: dashboard returns the created User resource; ceph-api returns Empty.
"PUT /api/user/{username}":
  - path: $
    reason: dashboard returns the updated User resource; ceph-api returns Empty.
"POST /api/user/{username}/change_password":
  - path: $
    reason: "error-path test (admin user lacks self-change context); error envelope formats diverge (ceph-api google.rpc.Status, dashboard {status,detail,request_id}). Move to a positive-case fixture when feasible."

# /api/role — ceph-api now emits `system` via proto; what's left is
