# Declared divergences between the ceph dashboard and ceph-api response
# bodies. Keys are endpoint ids in the form "<METHOD> <PATH-TEMPLATE>"
# (as in api/http.yaml); values are lists of JSONPath ignores with
# mandatory `reason:` strings.
#
# Every entry IS the migration guide for dashboard clients — something
# a client switching from the dashboard to ceph-api would observe.
#
# JSONPath subset: $ root, . descent, * wildcard for "any array index
# or map key" at a single position. See test/parity/diff.go for the
# matcher. A `$` (root) ignore additionally suppresses the body-presence
# and status-class checks — used as a transitional marker for endpoints
# whose response (or request) shape is known divergent. Each one is a
# debt: walk them in the next iteration and either match the dashboard
# or document a hard reason why we can't.
#
# **Policy.** Prefer well-typed proto APIs (Timestamp, int64) for the
# gRPC surface; the matcher already coerces the resulting JSON-shape
# divergences (RFC3339-vs-unix-seconds, int64-as-string-vs-int) so they
# do not need per-endpoint ignores. See CLAUDE.md → "Parity vs API
# quality" for the decision rule.

"POST /api/pool":
  - path: $
    reason: >-
      The dashboard wraps pool creation in an async task (@pool_task,
      wait_for=2.0): when create+follow-ups finish within 2s it returns
      201 with a null body, otherwise 202 with a task envelope
      {"name":"pool/create","metadata":{"pool_name":<pool>}}. Which one
      you get is timing-dependent. ceph-api is synchronous with no task
      queue, so it always returns 201 with an empty body once every mon
      command has completed. Both the status class (201 vs 202) and the
      body (empty vs task envelope) therefore diverge irreconcilably.
