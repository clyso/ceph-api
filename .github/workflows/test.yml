name: E2E tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "deploy/**"
      - "**.md"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: make check
        run: make check
      - name: Check for fmt drift
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::make check produced uncommitted changes (likely go fmt): $(git status --porcelain)"
            exit 1
          fi
      - name: make lint
        run: make lint
      - name: make proto
        run: make proto
      - name: Check for proto drift
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::make proto produced uncommitted changes: $(git status --porcelain)"
            exit 1
          fi
      - name: make e2e-test
        run: make e2e-test
