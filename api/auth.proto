syntax = "proto3";

option go_package = "github.com/clyso/ceph-api/api/ceph;pb";

package ceph;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

service Auth {
    rpc Login(LoginReq) returns (LoginResp);
    rpc Logout(google.protobuf.Empty) returns(google.protobuf.Empty);
    rpc Check(TokenCheckReq)returns(TokenCheckResp);
    rpc Whoami(google.protobuf.Empty) returns(WhoamiResp);
    rpc CreateAPIKey(CreateAPIKeyReq) returns(CreateAPIKeyResp);
    rpc ListAPIKeys(google.protobuf.Empty) returns(ListAPIKeysResp);
    rpc GetAPIKey(GetAPIKeyReq) returns(APIKeyResp);
    rpc RevokeAPIKey(RevokeAPIKeyReq) returns(google.protobuf.Empty);
}

message LoginReq{
    string username=1;
    string password=2;
}

message LoginResp{
    string token =1;
    string username =2;
    bool pwd_update_required =3;
    optional google.protobuf.Timestamp pwd_expiration_date =4;
    bool sso =5;
    map<string,google.protobuf.ListValue> permissions=6 ;
}

message TokenCheckReq{
    string token =1;
}

message TokenCheckResp{
    string username =1;
    bool pwd_update_required =2;
    optional google.protobuf.Timestamp pwd_expiration_date =3;
    bool sso =4;
    map<string,google.protobuf.ListValue> permissions=5 ;
}

message WhoamiResp{
    string subject =1;
    string auth_type =2;
    string api_key_id =3;
    repeated string roles =4;
    map<string,google.protobuf.ListValue> permissions=5 ;
}

message CreateAPIKeyReq{
    string name =1;
    string description =2;
    optional google.protobuf.Timestamp expires_at =3;
}

message CreateAPIKeyResp{
    APIKeyResp key =1;
    string token =2;
}

message ListAPIKeysResp{
    repeated APIKeyResp keys =1;
}

message GetAPIKeyReq{
    string key_id =1;
}

message RevokeAPIKeyReq{
    string key_id =1;
}

message APIKeyResp{
    string id =1;
    string name =2;
    string description =3;
    string owner =4;
    string cluster_id =5;
    bool enabled =6;
    optional google.protobuf.Timestamp revoked_at =7;
    optional google.protobuf.Timestamp created_at =8;
    string created_by =9;
    optional google.protobuf.Timestamp expires_at =10;
    optional google.protobuf.Timestamp last_used_at =11;
}

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
      title: "Ceph management API";
    //   version: "1.0";
      contact: {
        name: "Ceph API";
        url: "https://github.com/clyso/ceph-api";
        // email: "none@example.com";
      };
      license: {
        name: "GPL-3.0 license";
        url: "https://github.com/clyso/ceph-api/blob/main/LICENSE";
      };
    //   extensions: {
    //     key: "x-something-something";
    //     value {string_value: "yadda"}
    //   }
    };
    // Overwriting host entry breaks tests, so this is not done here.
    // external_docs: {
    //   url: "https://github.com/grpc-ecosystem/grpc-gateway";
    //   description: "More about gRPC-Gateway";
    // }
    schemes: HTTP;
    schemes: HTTPS;
    consumes: "application/json";
    produces: "application/json";
    security_definitions: {
      security: {
        key: "OAuth2";
        value: {
          type: TYPE_OAUTH2;
          flow: FLOW_PASSWORD;
          token_url: "http://localhost:9969/api/oauth/token";
          scopes: {
            scope: {
                key: "openid";
                value: "default scope"
             }
          }
        }
      }
    }
    security: {
      security_requirement: {
        key: "OAuth2";
        value: {
          scope: "openid";
        }
      }
    }
  };
